name: ci

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run a single matrix job (or 'all')"
        required: true
        default: "all"
        type: choice
        options: [all, linux-x64, linux-arm64]
  push:
    branches: [main]
    paths-ignore: ["durable-memory/**", "**.md"]
  pull_request:
    paths-ignore: ["durable-memory/**", "**.md"]

# The vendored upstream tools (iputils; iproute2/net-tools later) are
# Linux-only, so the matrix covers Linux x86_64 and arm64. Binaries are
# published as workflow artifacts and to the rolling `dist` branch; there is
# deliberately no release job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    env:
      ONLY_OK: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || matrix.name == inputs.only }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.ONLY_OK == 'true'
        with:
          persist-credentials: false

      - name: sync iputils + iperf3 sources, verify vendored sdk headers
        if: env.ONLY_OK == 'true'
        run: |
          scripts/sync-iputils.sh
          scripts/sync-iperf3.sh
          scripts/sync-sdk.sh --verify

      - name: toolchain
        if: runner.os == 'Linux' && env.ONLY_OK == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: lmscript compiler (npm @lmctl-ai/lmctl, DSL v5)
        if: env.ONLY_OK == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: install and probe the compiler
        if: env.ONLY_OK == 'true'
        shell: bash
        run: |
          npm i -g @lmctl-ai/lmctl@0.2.420
          scripts/select-compiler.sh | tee compiler.txt
          grep -q lmscript compiler.txt || { echo "no v5 compiler available"; exit 1; }

      - name: build and test
        if: env.ONLY_OK == 'true'
        shell: bash
        run: ./test.sh

      - name: package artifact
        if: env.ONLY_OK == 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp build/lmnet dist/lmnet-${{ matrix.name }}
          cp LICENSE THIRD_PARTY_NOTICES.md dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.ONLY_OK == 'true'
        with:
          name: lmnet-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # Push-and-publish: on every main push (and full manual re-runs) collect
  # the matrix binaries and force-update the rolling `dist` branch, so the
  # latest per-OS executables live at permanent URLs. No approval, no
  # release object; the branch head is always "the latest main build".
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push to the dist branch
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmnet-*
          path: ${{ runner.temp }}/bins
          merge-multiple: true

      - name: checksums
        run: (cd "${{ runner.temp }}/bins" && sha256sum lmnet-* > SHA256SUMS)

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true # the token must land in .git/config for the push
          fetch-depth: 1

      - name: update the dist branch
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin dist && git rev-parse -q --verify FETCH_HEAD; then
            git checkout -B dist FETCH_HEAD
          else
            git checkout --orphan dist
          fi
          git rm -rf . >/dev/null 2>&1 || true
          cp "${{ runner.temp }}/bins"/lmnet-* "${{ runner.temp }}/bins"/SHA256SUMS .
          cp LICENSE THIRD_PARTY_NOTICES.md . 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "dist branch already up to date"
          else
            git commit -m "dist: lmnet binaries from ${GITHUB_SHA}"
          fi
          git push --force-with-lease origin dist
